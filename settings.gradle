pluginManagement {
    includeBuild('build-logic')
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url = uri("https://jitpack.io")
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()
    }
}
rootProject.name = 'legado'

include ':app'
include ':core:designsystem'
include ':core:database'
include ':core:navigation'
include ':feature:bookshelf:api'
include ':feature:bookshelf:impl'
include ':feature:bookshelf:ui'
include ':feature:home:ui'
include ':feature:settings:api'
include ':feature:settings:impl'
include ':feature:settings:ui'
include ':feature:catalog:api'
include ':feature:catalog:impl'
include ':feature:catalog:ui'
include ':feature:rss:api'
include ':feature:rss:impl'
include ':feature:rss:ui'
include ':feature:readaloud:api'
include ':feature:readaloud:ui'
include ':feature:reader:api'
include ':feature:reader:ui'
include ':feature:ai:api'
