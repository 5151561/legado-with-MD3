// Compose 编译器稳定性配置。
//
// 这里列出的类会被无条件当作 stable，编译器不再做推断。
// 准入条件只有一条：类型全部字段为 val 且运行期不做原地修改。
// 违反这条会得到「跳过重组 + 界面停留在旧数据」，且极难排查。
//
// 为什么需要它：:feature:*:api 和 :core:database 都只挂 legado.android.library，
// 不经过 Compose 编译器，其中的类型在 UI 模块里一律被推断为 unstable。
//
// 坑：改本文件不会让 Kotlin 编译任务失效（编译器参数里只有路径，没有内容哈希）。
// 改完必须强制重跑，否则看到的还是旧结果：
//   ./gradlew :app:compileAppDebugKotlin --rerun -Plegado.composeCompilerReports=true

// --- feature api 模型 ---
// 已核实 7 个 api 模块 src/main 下 var 声明数为 0，全部是 val data class / enum。
io.legado.app.feature.bookshelf.api.*
io.legado.app.feature.settings.api.*
io.legado.app.feature.catalog.api.*
io.legado.app.feature.rss.api.*
io.legado.app.feature.readaloud.api.*
io.legado.app.feature.reader.api.*
io.legado.app.feature.ai.api.*

// --- 外部不可变值类型 ---
// java.time 的日期类是不可变的，但不在 Compose 的内置已知稳定列表里。
// 当前有 10 处 composable 因它被判 unstable。
java.time.LocalDate

// --- 故意不加入的 ---
// io.legado.app.data.entities.*
//   Room 实体是可变的（Book 一个类就有 59 个 var），且 ReadBook 等运行期协调者
//   会原地修改同一个实例。标 stable 会直接导致阅读进度、章节标题不刷新。
//   正确做法是让 UI 侧改用 api 模块的只读投影模型，而不是在这里放行。
