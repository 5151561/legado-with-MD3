# Phase 5 双轨生命周期登记表。
# status 只允许 experiment、default_observation、complete。
# complete 前不得删除 legacyPath；complete 时必须删除临时开关并提供 removalEvidence。
features=bookshelf,settings,catalog,rss,readaloud,reader,ai

bookshelf.gradleProperty=bookshelfFeatureEnabled
bookshelf.buildConfig=USE_COMPOSE_BOOKSHELF_FEATURE
bookshelf.card=docs/dev/bookshelf-phase2-migration-card.md
bookshelf.legacyPath=app/src/main/java/io/legado/app/feature/bookshelf/compat/LegacyBookshelfAdapter.kt
bookshelf.status=experiment
bookshelf.defaultEnabled=false
bookshelf.legacyRemovalAllowed=false
bookshelf.gateEvidence=none
bookshelf.removalEvidence=none
bookshelf.blocker=正式 impl、Release/R8、设备矩阵与稳定版本观察尚未签收

settings.gradleProperty=settingsFeatureEnabled
settings.buildConfig=USE_COMPOSE_SETTINGS_FEATURE
settings.card=docs/dev/settings-phase3-migration-card.md
settings.legacyPath=app/src/main/java/io/legado/app/feature/settings/compat/LegacySettingsAdapter.kt
settings.status=experiment
settings.defaultEnabled=false
settings.legacyRemovalAllowed=false
settings.gateEvidence=none
settings.removalEvidence=none
settings.blocker=设置子页边界、设备矩阵与稳定版本观察尚未签收

